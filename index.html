<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GARUSS — Каталог проектов</title><style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f2f1ed;color:#202020;font:16px/1.5 Arial,sans-serif}button{cursor:pointer;font:inherit}header{background:#202020;color:white;display:flex;justify-content:space-between;align-items:center;padding:25px 5vw}.brand{font-size:26px;font-weight:900;letter-spacing:-.08em}a{color:inherit;text-decoration:none}nav a{font-size:12px;text-transform:uppercase;letter-spacing:.1em}.hero{background:#202020;color:#fff;padding:110px 5vw 85px}.hero h1{font-size:clamp(49px,8vw,122px);letter-spacing:-.075em;line-height:.95;margin:20px 0 35px}.hero p{max-width:650px;color:#aaa;font-size:20px}.eyebrow{font-size:12px;letter-spacing:.18em;color:#c99296}.wrap{max-width:1450px;margin:auto;padding:70px 5vw 100px}.filters{display:flex;gap:9px;flex-wrap:wrap;margin:30px 0 45px}.filters button{border:1px solid #bbb;background:transparent;border-radius:30px;padding:10px 16px}.filters button.active{background:#242424;color:white}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:45px 26px}.card{cursor:pointer;min-width:0}.cover{aspect-ratio:1.56;background:linear-gradient(135deg,#393334,#151515);color:white;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.fallback{font-size:clamp(28px,4vw,60px);font-weight:900;letter-spacing:-.06em;max-width:80%;line-height:1}.cat{position:absolute;top:15px;left:15px;background:#f2f1ed;color:#333;padding:9px;font-size:11px;letter-spacing:.06em}.client{font-size:12px;font-weight:bold;color:#92000a;text-transform:uppercase;letter-spacing:.08em;margin-top:20px}.card h3{font-size:clamp(23px,3vw,34px);letter-spacing:-.05em;margin:5px 0}.viewer{display:none;position:fixed;inset:0;z-index:10;overflow:auto;background:#f2f1ed}.viewer.open{display:block}.bar{position:sticky;top:0;background:#202020;color:white;padding:14px 5vw;display:flex;justify-content:space-between;z-index:1}.bar button{border:1px solid #666;color:white;background:transparent;padding:10px 18px}.inside{max-width:1150px;padding:65px 25px;margin:auto}.inside h2{font-size:clamp(35px,6vw,70px);letter-spacing:-.065em;line-height:1;margin:12px 0 25px}.inside p{color:#777}.slides{margin-top:45px}.slides img{width:100%;display:block;margin-bottom:15px}.notice{padding:35px;background:#e8e3de}.move{display:flex;justify-content:space-between;margin-top:45px;border-top:1px solid #bbb;padding-top:20px;gap:20px}.move button{background:none;border:0;max-width:45%;text-align:left}.move button:last-child{text-align:right}footer{background:#202020;color:white;padding:55px 5vw;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}.hero{padding:75px 5vw}.cover{aspect-ratio:1.3}}</style></head>
<body><header><a href="#" class="brand">GARUSS<span style="color:#92000a">.</span></a><nav><a href="https://garuss.ru" target="_blank">Основной сайт ↗</a></nav></header><section class="hero"><span class="eyebrow">DESIGN / PRODUCTION / IDEAS</span><h1>ИДЕИ ДЛЯ<br>ВАШЕГО БРЕНДА.</h1><p>Каталог проектов. Корпоративные подарки, мерч, упаковка и настольные игры. От идеи до воплощения.</p></section><main class="wrap" id="catalog"><h2 style="font-size:48px;letter-spacing:-.06em;margin:0">ПРОЕКТЫ</h2><div class="filters" id="filters"></div><div class="grid" id="grid"></div></main><footer><b class="brand">GARUSS.</b><p>Создаём подарки с 2002 года · <a href="https://garuss.ru">garuss.ru</a></p></footer><section class="viewer" id="viewer"><div class="bar"><b class="brand">GARUSS.</b><button onclick="closeCase()">✕ Закрыть</button></div><article class="inside"><div id="vclient" class="client"></div><h2 id="vtitle"></h2><p id="vdesc"></p><div class="slides" id="slides"></div><div class="move"><button onclick="move(-1)" id="prev"></button><button onclick="move(1)" id="next"></button></div></article></section><script>
const cases=[["burservis-gifts","Бурсервис","Корпоративные подарки","Подарочные наборы",0,0],["akku-gifts","АККУ Фертриб","Подарки к Новому году","Подарочные наборы",0,0],["malltech","Malltech","Новогодние подарки 2027","Подарочные наборы",9,3],["nordgold-gifts","Nordgold","Награды и подарочные наборы","Награды",23,4],["gv-gold-game","GV Gold","Игра «Путь к золоту»","Настольные игры",4,3],["nordgold-game","Nordgold","Игра «Путь к золоту»","Настольные игры",5,3],["akku-game","АККУ Фертриб","Две концепции настольной игры","Настольные игры",6,3],["zemsky","Земский банк","Лото: три варианта оформления","Настольные игры",13,3],["burservis-pens","Бурсервис","Пишущие инструменты","Мерч",12,4],["merch","Корпоративный мерч","Поло, футболки и бейсболки","Мерч",6,2]];let active=-1,filter="Все кейсы";const cats=["Все кейсы",...new Set(cases.map(c=>c[3]))];const path=c=>c[4]?`assets/${c[0]}/${String(c[5]).padStart(2,"0")}.jpg`:null;function render(){document.getElementById("filters").innerHTML=cats.map(c=>`<button class="${filter===c?"active":""}" data-cat="${c}">${c}</button>`).join("");document.querySelectorAll("[data-cat]").forEach(e=>e.onclick=()=>{filter=e.dataset.cat;render()});document.getElementById("grid").innerHTML=cases.map((c,i)=>filter==="Все кейсы"||c[3]===filter?`<article class="card" data-i="${i}" tabindex="0" role="button"><div class="cover"><span class="cat">${c[3]}</span><span class="fallback">${c[1]}</span>${path(c)?`<img src="${path(c)}" alt="${c[2]}" onerror="this.style.display='none'" style="position:absolute;inset:0">`:""}</div><div class="client">${c[1]}</div><h3>${c[2]}</h3><small>${c[4]?`${c[4]} изображений`:"Фотографии готовятся"}</small></article>`:"").join("");document.querySelectorAll(".card").forEach(e=>{e.onclick=()=>openCase(+e.dataset.i);e.onkeydown=k=>{if(k.key==="Enter")openCase(+e.dataset.i)}})}function openCase(i){active=(i+cases.length)%cases.length;const c=cases[active];document.getElementById("vclient").textContent=c[1]+" / "+c[3];document.getElementById("vtitle").textContent=c[2];document.getElementById("vdesc").textContent="Подборка концепций и вариантов оформления для компании "+c[1]+".";document.getElementById("slides").innerHTML=c[4]?Array.from({length:c[4]},(_,j)=>`<img loading="lazy" src="assets/${c[0]}/${String(j+1).padStart(2,"0")}.jpg" alt="${c[2]} — изображение ${j+1}" onerror="this.style.display='none'">`).join(""):'<p class="notice">Изображения этого проекта готовятся к публикации.</p>';document.getElementById("prev").textContent="← "+cases[(active-1+cases.length)%cases.length][1]+" · "+cases[(active-1+cases.length)%cases.length][2];document.getElementById("next").textContent=cases[(active+1)%cases.length][1]+" · "+cases[(active+1)%cases.length][2]+" →";document.getElementById("viewer").classList.add("open");document.body.style.overflow="hidden";document.getElementById("viewer").scrollTop=0}function closeCase(){active=-1;document.getElementById("viewer").classList.remove("open");document.body.style.overflow=""}function move(d){openCase(active+d)}window.addEventListener("keydown",e=>{if(active<0)return;if(e.key==="Escape")closeCase();if(e.key==="ArrowRight")move(1);if(e.key==="ArrowLeft")move(-1)});render();
</script></body></html>
